name: Deploy to GitHub Pages

on:
  # Run on every push to main
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel an in-progress deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
        # Exposes `base_path` (e.g. /creator-growth-tools) that we pass into
        # the build so Next.js generates correct asset URLs.

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Tells next.config.ts the sub-path for GitHub Pages
          # e.g. /creator-growth-tools
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Canonical site URL for metadataBase, sitemap.xml, robots.txt, JSON-LD
          # e.g. https://sayyedaaman2.github.io/creator-growth-tools
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the static export output directory
          path: ./out

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
